<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感谢下载 · 墨章写作</title>
<style>
:root {
  --primary: #7C3AED;
  --primary-light: #A78BFA;
  --primary-dark: #6D28D9;
  --primary-bg: #F5F3FF;
  --bg: #FAFAFB;
  --surface: #FFFFFF;
  --border: #E5E7EB;
  --text: #1F2937;
  --text-secondary: #6B7280;
  --text-tertiary: #9CA3AF;
  --gradient: linear-gradient(135deg, #7C3AED 0%, #A78BFA 50%, #6366F1 100%);
  --gradient-soft: linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 50%, #EEF2FF 100%);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--gradient-soft);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

body::before {
  content: '';
  position: absolute;
  top: -150px; left: -150px;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(124,58,237,0.1), transparent 70%);
  border-radius: 50%;
  animation: float 8s ease-in-out infinite;
}

body::after {
  content: '';
  position: absolute;
  bottom: -120px; right: -120px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(99,102,241,0.08), transparent 70%);
  border-radius: 50%;
  animation: float 10s ease-in-out infinite reverse;
}

@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(30px, -20px) scale(1.05); }
}

.card {
  position: relative;
  z-index: 1;
  background: var(--surface);
  border-radius: 24px;
  padding: 64px 56px;
  max-width: 480px;
  width: 90%;
  text-align: center;
  box-shadow: 0 24px 80px rgba(124, 58, 237, 0.12);
  border: 1px solid var(--border);
  animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(32px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.icon-wrap {
  width: 88px; height: 88px;
  margin: 0 auto 32px;
  border-radius: 24px;
  background: var(--gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 32px rgba(124, 58, 237, 0.35);
  animation: iconBounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
}

@keyframes iconBounce {
  from { transform: scale(0) rotate(-30deg); opacity: 0; }
  to { transform: scale(1) rotate(0); opacity: 1; }
}

.icon-wrap svg { width: 44px; height: 44px; color: white; }

.card h1 {
  font-size: 30px;
  font-weight: 800;
  margin-bottom: 12px;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.card .sub {
  font-size: 16px;
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 36px;
}

.tips {
  background: var(--primary-bg);
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 36px;
  text-align: left;
}

.tips .tip-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tips .tip-title svg { width: 16px; height: 16px; }

.tips ul {
  list-style: none;
  padding: 0;
}

.tips li {
  font-size: 14px;
  color: var(--text-secondary);
  padding: 4px 0;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  line-height: 1.6;
}

.tips li::before {
  content: '';
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--primary-light);
  margin-top: 8px;
  flex-shrink: 0;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 36px;
  background: var(--gradient);
  color: white;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.25s ease;
  border: none;
  cursor: pointer;
  box-shadow: 0 8px 32px rgba(124, 58, 237, 0.3);
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(124, 58, 237, 0.4);
}

.btn svg { width: 20px; height: 20px; }

.footer-note {
  margin-top: 24px;
  font-size: 12px;
  color: var(--text-tertiary);
}
</style>
</head>
<body>

<div class="card">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h1>感谢下载墨章写作</h1>
  <p class="sub">你的支持是我们持续打磨的动力。<br>愿墨章陪伴你写下每一个精彩故事。</p>

  <div class="tips">
    <div class="tip-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 18v-5.25m0 0a6.01 6.01 0 001.5-.189m-1.5.189a6.01 6.01 0 01-1.5-.189m3.75 7.478a12.06 12.06 0 01-4.5 0m3.75 2.355a7.49 7.49 0 01-3 0M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m-9-3l-3-7.5m12 7.5l3-7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      快速上手
    </div>
    <ul>
      <li>双击 墨章 即可启动</li>
      <li>推荐电脑上安装 Edge 浏览器内核</li>
      <li>确保电脑已经安装了WebView2（浏览器驱动）</li>
      <li>首次使用请点击「打开文件夹」选择工作目录</li>
      <li>Ctrl+S 快速保存，一键打包合并章节</li>
    </ul>
  </div>

  <p class="footer-note">© 2026 墨章写作 · 纯本地运行，数据安全无忧</p>
</div>

</body>
</html>
