<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢迎下次使用 · 墨章写作</title>
<style>
:root {
  --primary: #7C3AED;
  --primary-light: #A78BFA;
  --primary-dark: #6D28D9;
  --primary-bg: #F5F3FF;
  --bg: #FAFAFB;
  --surface: #FFFFFF;
  --border: #E5E7EB;
  --text: #1F2937;
  --text-secondary: #6B7280;
  --text-tertiary: #9CA3AF;
  --gradient: linear-gradient(135deg, #7C3AED 0%, #A78BFA 50%, #6366F1 100%);
  --gradient-soft: linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 50%, #EEF2FF 100%);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--gradient-soft);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

body::before {
  content: '';
  position: absolute;
  top: -100px; right: -100px;
  width: 450px; height: 450px;
  background: radial-gradient(circle, rgba(124,58,237,0.1), transparent 70%);
  border-radius: 50%;
  animation: float 9s ease-in-out infinite;
}

body::after {
  content: '';
  position: absolute;
  bottom: -120px; left: -120px;
  width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(99,102,241,0.08), transparent 70%);
  border-radius: 50%;
  animation: float 11s ease-in-out infinite reverse;
}

@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-25px, 20px) scale(1.05); }
}

.card {
  position: relative;
  z-index: 1;
  background: var(--surface);
  border-radius: 24px;
  padding: 64px 56px;
  max-width: 480px;
  width: 90%;
  text-align: center;
  box-shadow: 0 24px 80px rgba(124, 58, 237, 0.12);
  border: 1px solid var(--border);
  animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(32px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.icon-wrap {
  width: 88px; height: 88px;
  margin: 0 auto 32px;
  border-radius: 50%;
  background: var(--gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 32px rgba(124, 58, 237, 0.3);
  animation: wave 1.2s ease-in-out infinite;
  position: relative;
}

@keyframes wave {
  0%, 100% { transform: rotate(0deg); }
  20% { transform: rotate(-12deg); }
  40% { transform: rotate(14deg); }
  60% { transform: rotate(-8deg); }
  80% { transform: rotate(6deg); }
}

.icon-wrap svg { width: 44px; height: 44px; color: white; }

.card h1 {
  font-size: 30px;
  font-weight: 800;
  margin-bottom: 12px;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.card .sub {
  font-size: 16px;
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 16px;
}

.quote {
  font-family: "Noto Serif SC", "SimSun", serif;
  font-size: 15px;
  color: var(--text-tertiary);
  font-style: italic;
  line-height: 1.8;
  margin-bottom: 36px;
  padding: 0 16px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 36px;
  background: var(--gradient);
  color: white;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.25s ease;
  border: none;
  cursor: pointer;
  box-shadow: 0 8px 32px rgba(124, 58, 237, 0.3);
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(124, 58, 237, 0.4);
}

.btn svg { width: 20px; height: 20px; }

.footer-note {
  margin-top: 24px;
  font-size: 12px;
  color: var(--text-tertiary);
}
</style>
</head>
<body>

<div class="card">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7.5 8.25h3m-3 3h3m-3 3h3M15 8.25h3M15 12h3M15 15.75h3M4.5 19.5h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h1>欢迎下次使用</h1>
  <p class="sub">感谢你与墨章共度的创作时光。<br>你的故事，我们一直珍视。</p>
  <p class="quote">「笔落惊风雨，墨成泣鬼神。<br>愿下一次重逢，灵感依旧如泉涌。」</p>

  <p class="footer-note">© 2026 墨章写作 · 纯本地运行，数据安全无忧</p>
</div>

</body>
</html>
