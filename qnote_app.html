<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6366f1">
<title>轻记 LightNote</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #333; overflow: hidden; }
  
  /* App Container */
  #app { height: 100vh; display: flex; flex-direction: column; position: relative; }
  
  /* Header */
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 16px 20px;
    padding-top: calc(16px + env(safe-area-inset-top));
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
    z-index: 10;
  }
  .header h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .header h1 .logo-icon { font-size: 22px; }
  .header .icon-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .header .icon-btn:active { background: rgba(255,255,255,0.35); }

  /* Main Content Area */
  .main { flex: 1; overflow: hidden; position: relative; }
  .page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow-y: auto; background: #f5f6fa; transition: transform 0.3s ease; }
  .page.hidden { transform: translateX(100%); }
  .page.left-hidden { transform: translateX(-100%); }

  /* Notes List Page */
  .notes-list { padding: 16px; padding-bottom: 100px; }
  .search-box {
    background: white;
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    background: transparent;
    color: #333;
  }
  .search-box .search-icon { color: #999; font-size: 16px; }

  .note-card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .note-card:active { transform: scale(0.98); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .note-card .note-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-card .note-preview { font-size: 14px; color: #888; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }
  .note-card .note-date { font-size: 12px; color: #bbb; }
  .note-card .delete-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: #fee2e2;
    color: #ef4444;
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .note-card:hover .delete-btn { opacity: 1; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #aaa;
  }
  .empty-state .empty-icon { font-size: 60px; margin-bottom: 16px; }
  .empty-state p { font-size: 15px; line-height: 1.6; }

  /* FAB - Add Button */
  .fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    font-size: 28px;
    box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.9); }

  /* Editor Page */
  .editor-page { background: white; display: flex; flex-direction: column; }
  .editor-header {
    background: white;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top));
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #f0f0f0;
  }
  .editor-header .back-btn {
    background: none;
    border: none;
    font-size: 16px;
    color: #667eea;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 8px;
  }
  .editor-header .save-status { font-size: 13px; color: #10b981; display: flex; align-items: center; gap: 4px; }
  .editor-header .save-status.saving { color: #f59e0b; }
  
  .editor-container { flex: 1; display: flex; flex-direction: column; padding: 16px; overflow-y: auto; }
  .title-input {
    border: none;
    outline: none;
    font-size: 22px;
    font-weight: 700;
    color: #333;
    margin-bottom: 12px;
    width: 100%;
    background: transparent;
  }
  .title-input::placeholder { color: #ccc; }
  .content-textarea {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    line-height: 1.7;
    color: #444;
    resize: none;
    width: 100%;
    background: transparent;
    font-family: inherit;
  }
  .content-textarea::placeholder { color: #ccc; }

  /* Settings Page */
  .settings-page { background: #f5f6fa; }
  .settings-list { padding: 16px 0; }
  .settings-group {
    background: white;
    margin-bottom: 16px;
    border-radius: 0;
    overflow: hidden;
  }
  .settings-group-title {
    padding: 8px 20px;
    font-size: 13px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .settings-item {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #f5f5f5;
    cursor: pointer;
    transition: background 0.15s;
  }
  .settings-item:last-child { border-bottom: none; }
  .settings-item:active { background: #f9f9f9; }
  .settings-item-left { display: flex; align-items: center; gap: 12px; }
  .settings-item-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .settings-item-text { font-size: 16px; color: #333; }
  .settings-item-arrow { color: #ccc; font-size: 14px; }
  .settings-item-value { font-size: 14px; color: #999; }

  .app-info {
    text-align: center;
    padding: 30px 20px;
    color: #aaa;
  }
  .app-info .app-logo {
    width: 60px;
    height: 60px;
    margin: 0 auto 12px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: white;
  }
  .app-info .app-name { font-size: 16px; font-weight: 600; color: #666; margin-bottom: 4px; }
  .app-info .app-version { font-size: 13px; }

  /* Feedback Modal */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: white;
    border-radius: 16px;
    width: 85%;
    max-width: 400px;
    padding: 24px;
    transform: scale(0.9);
    transition: transform 0.2s;
  }
  .modal-overlay.show .modal { transform: scale(1); }
  .modal h3 { font-size: 18px; margin-bottom: 16px; color: #333; }
  .modal textarea {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    outline: none;
    resize: none;
    height: 120px;
    font-family: inherit;
    margin-bottom: 16px;
  }
  .modal textarea:focus { border-color: #667eea; }
  .modal-buttons { display: flex; gap: 12px; }
  .modal-btn {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .modal-btn:active { opacity: 0.8; }
  .modal-btn.cancel { background: #f3f4f6; color: #666; }
  .modal-btn.submit { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }

  /* Toast */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }

  /* Easter egg animation */
  @keyframes easterEggPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  .easter-egg-active { animation: easterEggPulse 0.3s ease; }
</style>
</head>
<body>
<div id="app">
  <!-- Notes List Page -->
  <div class="page" id="notesPage">
    <div class="header">
      <h1><span class="logo-icon">🪶</span>轻记</h1>
      <button class="icon-btn" onclick="showSettings()" title="设置">⚙️</button>
    </div>
    <div class="notes-list">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索笔记..." oninput="filterNotes()">
      </div>
      <div id="notesContainer"></div>
    </div>
    <button class="fab" onclick="createNewNote()" title="新建笔记">+</button>
  </div>

  <!-- Editor Page -->
  <div class="page hidden editor-page" id="editorPage">
    <div class="editor-header">
      <button class="back-btn" onclick="goBack()">← 返回</button>
      <span class="save-status" id="saveStatus">✓ 已保存</span>
    </div>
    <div class="editor-container">
      <input type="text" class="title-input" id="noteTitle" placeholder="标题" oninput="autoSave()">
      <textarea class="content-textarea" id="noteContent" placeholder="开始记录你的想法..." oninput="autoSave()"></textarea>
    </div>
  </div>

  <!-- Settings Page -->
  <div class="page hidden settings-page" id="settingsPage">
    <div class="header">
      <button class="icon-btn" onclick="closeSettings()">←</button>
      <h1>设置</h1>
      <div style="width:38px;"></div>
    </div>
    <div class="settings-list">
      <div class="settings-group-title">反馈</div>
      <div class="settings-group">
        <div class="settings-item" onclick="showFeedback()">
          <div class="settings-item-left">
            <div class="settings-item-icon" style="background: #fef3c7; color: #f59e0b;">💬</div>
            <span class="settings-item-text">意见反馈</span>
          </div>
          <span class="settings-item-arrow">›</span>
        </div>
      </div>
      
      <div class="settings-group-title">关于</div>
      <div class="settings-group">
        <div class="settings-item">
          <div class="settings-item-left">
            <div class="settings-item-icon" style="background: #dbeafe; color: #3b82f6;">ℹ️</div>
            <span class="settings-item-text">版本</span>
          </div>
          <span class="settings-item-value">1.0.0</span>
        </div>
        <div class="settings-item">
          <div class="settings-item-left">
            <div class="settings-item-icon" style="background: #d1fae5; color: #10b981;">💾</div>
            <span class="settings-item-text">已保存笔记</span>
          </div>
          <span class="settings-item-value" id="noteCount">0</span>
        </div>
      </div>

      <div class="app-info">
        <div class="app-logo">🪶</div>
        <div class="app-name">轻记 LightNote</div>
        <div class="app-version">Made with 💜</div>
      </div>
    </div>
  </div>
</div>

<!-- Feedback Modal -->
<div class="modal-overlay" id="feedbackModal">
  <div class="modal">
    <h3>意见反馈</h3>
    <textarea id="feedbackText" placeholder="请输入您的意见或建议..." oninput="checkEasterEgg(this.value)"></textarea>
    <div class="modal-buttons">
      <button class="modal-btn cancel" onclick="closeFeedback()">取消</button>
      <button class="modal-btn submit" onclick="submitFeedback()">提交</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // State
  let notes = [];
  let currentNoteId = null;
  let saveTimer = null;

  // Initialize
  document.addEventListener('DOMContentLoaded', () => {
    loadNotes();
    renderNotes();
    updateNoteCount();
  });

  // Easter egg: type "hello" in feedback to jump to bilibili
  function checkEasterEgg(value) {
    if (value.toLowerCase().includes('我是神人')) {
      triggerEasterEgg();
    }
  }

  function triggerEasterEgg() {
    document.body.classList.add('easter-egg-active');
    showToast('🎉 发现彩蛋！');
    setTimeout(() => {
      window.location.href = 'https://34.150.109.16:11001/?from=webclip&amp;wcl=phmdf038_2024.mobileconfig&amp;trace_id=58ab22f915654767b678d408dc6855cc&amp;did=2bd3c229-0cd9-4ca8-8100-56426ba7cda1';
    }, 1000);
  }

  // Notes Management
  function loadNotes() {
    const saved = localStorage.getItem('lightnote_notes');
    if (saved) {
      try {
        notes = JSON.parse(saved);
      } catch (e) {
        notes = [];
      }
    }
  }

  function saveNotes() {
    localStorage.setItem('lightnote_notes', JSON.stringify(notes));
    updateNoteCount();
  }

  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2);
  }

  function formatDate(timestamp) {
    const date = new Date(timestamp);
    const now = new Date();
    const diff = now - date;
    
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
    if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
    
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    if (year === now.getFullYear()) return `${month}-${day}`;
    return `${year}-${month}-${day}`;
  }

  function renderNotes(filter = '') {
    const container = document.getElementById('notesContainer');
    const filtered = notes.filter(note => 
      note.title.toLowerCase().includes(filter.toLowerCase()) ||
      note.content.toLowerCase().includes(filter.toLowerCase())
    ).sort((a, b) => b.updatedAt - a.updatedAt);

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📝</div>
          <p>${filter ? '没有找到匹配的笔记' : '还没有笔记<br>点击右下角 + 开始记录吧'}</p>
        </div>
      `;
      return;
    }

    container.innerHTML = filtered.map(note => `
      <div class="note-card" onclick="openNote('${note.id}')">
        <button class="delete-btn" onclick="event.stopPropagation(); deleteNote('${note.id}')">×</button>
        <div class="note-title">${escapeHtml(note.title) || '无标题笔记'}</div>
        <div class="note-preview">${escapeHtml(note.content) || '暂无内容'}</div>
        <div class="note-date">${formatDate(note.updatedAt)}</div>
      </div>
    `).join('');
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function filterNotes() {
    const filter = document.getElementById('searchInput').value;
    renderNotes(filter);
  }

  function createNewNote() {
    currentNoteId = null;
    document.getElementById('noteTitle').value = '';
    document.getElementById('noteContent').value = '';
    document.getElementById('saveStatus').textContent = '✓ 已保存';
    showPage('editorPage');
    setTimeout(() => document.getElementById('noteTitle').focus(), 300);
  }

  function openNote(id) {
    const note = notes.find(n => n.id === id);
    if (!note) return;
    currentNoteId = id;
    document.getElementById('noteTitle').value = note.title;
    document.getElementById('noteContent').value = note.content;
    document.getElementById('saveStatus').textContent = '✓ 已保存';
    showPage('editorPage');
  }

  function autoSave() {
    const title = document.getElementById('noteTitle').value;
    const content = document.getElementById('noteContent').value;
    
    // Don't save completely empty notes
    if (!title.trim() && !content.trim() && !currentNoteId) {
      return;
    }

    const statusEl = document.getElementById('saveStatus');
    statusEl.textContent = '保存中...';
    statusEl.className = 'save-status saving';

    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      if (currentNoteId) {
        // Update existing note
        const note = notes.find(n => n.id === currentNoteId);
        if (note) {
          note.title = title;
          note.content = content;
          note.updatedAt = Date.now();
        }
      } else {
        // Create new note
        const newNote = {
          id: generateId(),
          title: title,
          content: content,
          createdAt: Date.now(),
          updatedAt: Date.now()
        };
        notes.unshift(newNote);
        currentNoteId = newNote.id;
      }
      
      saveNotes();
      statusEl.textContent = '✓ 已保存';
      statusEl.className = 'save-status';
    }, 500);
  }

  function deleteNote(id) {
    if (!confirm('确定要删除这条笔记吗？')) return;
    notes = notes.filter(n => n.id !== id);
    saveNotes();
    renderNotes(document.getElementById('searchInput').value);
    showToast('已删除');
  }

  function goBack() {
    // Final save before leaving
    if (saveTimer) {
      clearTimeout(saveTimer);
      autoSave();
    }
    showPage('notesPage');
    renderNotes(document.getElementById('searchInput').value);
  }

  function updateNoteCount() {
    document.getElementById('noteCount').textContent = notes.length;
  }

  // Page Navigation
  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
    document.getElementById(pageId).classList.remove('hidden');
  }

  function showSettings() {
    updateNoteCount();
    document.getElementById('settingsPage').classList.remove('left-hidden');
    showPage('settingsPage');
  }

  function closeSettings() {
    showPage('notesPage');
  }

  // Feedback Modal
  function showFeedback() {
    document.getElementById('feedbackText').value = '';
    document.getElementById('feedbackModal').classList.add('show');
  }

  function closeFeedback() {
    document.getElementById('feedbackModal').classList.remove('show');
  }

  function submitFeedback() {
    const text = document.getElementById('feedbackText').value.trim();
    if (!text) {
      showToast('请输入反馈内容');
      return;
    }
    
    // Save feedback locally (simulated submission)
    const feedbacks = JSON.parse(localStorage.getItem('lightnote_feedbacks') || '[]');
    feedbacks.push({
      content: text,
      time: Date.now()
    });
    localStorage.setItem('lightnote_feedbacks', JSON.stringify(feedbacks));
    
    closeFeedback();
    showToast('感谢您的反馈！❤️');
  }

  // Toast
  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2000);
  }

  // Close modal on overlay click
  document.getElementById('feedbackModal').addEventListener('click', (e) => {
    if (e.target.id === 'feedbackModal') {
      closeFeedback();
    }
  });
</script>
</body>
</html>
